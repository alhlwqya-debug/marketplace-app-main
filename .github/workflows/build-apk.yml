name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # قمنا بإلغاء الكاش هنا لإجباره على التحديث



      - name: Override google-services.json from secret (if set)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
            echo "✅ Used secret google-services.json"
          else
            echo "ℹ️ Using placeholder google-services.json from repo"
          fi

      - name: Override firebase_options.dart from secret (if set)
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_DART }}" ]; then
            echo '${{ secrets.FIREBASE_OPTIONS_DART }}' > lib/firebase_options.dart
            echo "✅ Used secret firebase_options.dart"
          else
            echo "ℹ️ Using placeholder firebase_options.dart from repo"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "✅ APK built successfully!"
          ls -lh "$APK"
          echo "Size: $(du -sh "$APK" | cut -f1)"
