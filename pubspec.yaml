name: marketplace_app
description: A comprehensive marketplace mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Supabase (Alternative to Firebase - FREE TIER: 1GB Storage + 500MB Database)
  supabase_flutter: ^2.3.4

  # Localizations (required for Arabic RTL support)
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0
  cloud_firestore: ^4.15.1
  firebase_storage: ^11.6.1

  # Cloudinary (FREE TIER: 25GB Storage + 25GB Transfer)
  cloudinary_sdk: ^5.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.1.2
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0

  # Navigation
  go_router: ^13.0.1

  # Forms & Validation
  formz: ^0.6.1

  # Payments
  flutter_stripe: ^9.5.0+1

  # Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0

  # Notifications
  flutter_local_notifications: 17.2.3

  # Utils
  intl: ^0.20.2
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  permission_handler: ^11.1.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

  # Theming
  google_fonts: ^6.1.0
  flex_color_scheme: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_ce_generator: ^1.11.2
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/placeholders/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
